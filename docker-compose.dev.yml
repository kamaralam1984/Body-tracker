# Local development stack: `docker compose -f docker-compose.dev.yml up`
# Bind-mounts the repo into the container so edits hot-reload without a
# rebuild. Named volumes for node_modules/.next keep the container's own
# (Linux-native) build artifacts from being shadowed by the host mount.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3045:3045"
    environment:
      NODE_ENV: development
      BTK_JWT_SECRET: dev-only-insecure-secret-change-in-production
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: npm run dev -- -p 3045

volumes:
  node_modules:
  next_cache:

# Body Tracker — production Nginx reverse-proxy config.
#
# Install: copy to /etc/nginx/sites-available/body-tracker.conf, symlink
# into sites-enabled, `nginx -t`, `systemctl reload nginx`. See
# docs/ops/nginx-guide.md for the full walkthrough including Certbot/TLS
# provisioning and the PM2-vs-Docker upstream choice below.
#
# Upstream target: PM2's cluster mode runs all worker processes behind ONE
# shared listening port (Node's cluster module load-balances internally),
# so a single upstream entry is correct for the PM2 deployment path (see
# ecosystem.config.js). If deploying via Docker with multiple app
# container replicas instead, add one `server` line per replica here.
upstream body_tracker_app {
    server 127.0.0.1:3045;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Rate limiting — burst-tolerant per-IP limit on the API surface. Tune
# `rate` to the real traffic profile once deployed; this is a sane default.
limit_req_zone $binary_remote_addr zone=btk_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=btk_conn:10m;

# HTTP -> HTTPS redirect (also serves ACME HTTP-01 challenges for Certbot).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` is the combined form supported back to nginx 1.9.5
    # (validated against nginx 1.24 here); nginx 1.25.1+ also accepts the
    # newer standalone `http2 on;` directive if preferred.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # HTTP/3 ready: requires an nginx build with the QUIC/HTTP3 module
    # (not part of stock nginx as of this writing). Once available, add:
    #   listen 443 quic reuseport;
    #   add_header Alt-Svc 'h3=":443"; ma=86400';
    server_name example.com www.example.com; # replace with the real domain

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers. The app itself sets the same headers (see
    # src/proxy.ts) so this is defense-in-depth, not the only layer —
    # both must exist since the app must also be safe when accessed
    # directly (health checks, internal traffic bypassing this proxy).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    # Brotli gives better compression than gzip but requires the
    # ngx_brotli module (not compiled into stock nginx). If installed:
    #   brotli on;
    #   brotli_comp_level 5;
    #   brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    error_page 404 /404.html;
    location = /404.html {
        root /var/www/body-tracker/error-pages;
        internal;
    }
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/body-tracker/error-pages;
        internal;
    }

    # Immutable static assets — Next.js content-hashes these filenames, so
    # a long-lived cache is always safe.
    location /_next/static/ {
        proxy_pass http://body_tracker_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Server-Sent-Events tracking stream — must NOT be buffered, and needs
    # a long read timeout since it's a genuinely long-lived connection.
    location /api/v1/tracking/ {
        proxy_pass http://body_tracker_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=btk_api burst=10 nodelay;
    }

    # REST API surface.
    location /api/ {
        proxy_pass http://body_tracker_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=btk_api burst=40 nodelay;
        limit_conn btk_conn 20;
    }

    # Everything else — the Next.js app itself (pages, RSC payloads, etc).
    # `Upgrade`/`Connection` headers are forwarded so this config also
    # works unmodified if a future release adds a real WebSocket route.
    location / {
        proxy_pass http://body_tracker_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

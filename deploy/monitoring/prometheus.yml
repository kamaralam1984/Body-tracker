global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: body-tracker-app
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["app:3000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

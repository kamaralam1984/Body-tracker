# Production-shaped topology for the Body Tracker API Platform.
#
# The app is Prisma-backed against real Postgres (see prisma/schema.prisma)
# and reads DATABASE_URL directly — that part of this file is already true
# in production, not aspirational. REDIS_URL is still opt-in: when unset,
# the app degrades to correct-for-a-single-worker in-memory rate limiting
# (src/server/http/rate-limit.ts); when set, rate limiting (and any other
# state that needs to be shared across PM2's cluster-mode workers — see
# ecosystem.config.js's `instances: "max"`) uses this real Redis instance
# instead. The VPS bare-metal deploy path doesn't use this compose file at
# all (see ecosystem.config.js) — this documents the Docker-based topology
# and is also the reference for what to install directly on the VPS if you
# want Redis there instead (e.g. `apt install redis-server`).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3045:3000"
    environment:
      NODE_ENV: production
      BTK_JWT_SECRET: ${BTK_JWT_SECRET:-dev-only-insecure-secret-change-in-production}
      DATABASE_URL: postgresql://body_tracker:body_tracker@postgres:5432/body_tracker
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: body_tracker
      POSTGRES_PASSWORD: body_tracker
      POSTGRES_DB: body_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U body_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Opt-in observability stack — not required to run the app (see the
  # per-metric fallback notes in src/app/api/v1/metrics/route.ts).
  # `deploy/monitoring/prometheus.yml` already scrapes `app:3000/api/v1/metrics`
  # (a real, working endpoint today, with or without this stack running);
  # `deploy/monitoring/alerts.yml` has real alert rules against the real
  # `btk_*` metric names; `deploy/monitoring/grafana/provisioning/` wires
  # Grafana to this Prometheus and auto-loads the dashboard JSON in
  # `grafana/provisioning/dashboards/json/`. Start with
  # `docker compose --profile observability up -d`.
  prometheus:
    # Unpinned by design here (unlike postgres/redis above) — pin to a
    # specific tag once you've actually stood this profile up and know
    # which version you're running.
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3300:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
